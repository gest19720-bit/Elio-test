<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>Sign in — Elio</title><link rel="stylesheet" href="variables.css"><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="components.css"></head><body><main class="auth-page"><section class="auth-panel"><a class="auth-brand" href="index.html"><img class="brand-mark" src="elio-logo.jpeg" alt=""><strong class="brand-name">elio</strong></a><div class="form-card"><span class="eyebrow">Welcome back</span><h1 style="margin-top:8px">The calm behind your business.</h1><p style="margin:12px 0 24px">Sign in and see what needs your attention today.</p><form data-auth-form="login"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p class="auth-message" data-message aria-live="polite"></p><button class="btn btn-primary" type="submit">Sign in</button></form><p style="margin-top:20px">New to Elio? <a href="signup.html" style="color:var(--elio-blue);font-weight:700">Create an account</a></p></div></section><aside class="auth-aside"><div><span class="eyebrow" style="color:var(--elio-amber)">Quiet intelligence</span><h2 style="font-size:42px;margin-top:14px;color:#fff">You run the business.<br>Elio handles what happens behind it.</h2><p>Clear next steps, thoughtful follow-ups, and a record of everything Elio does.</p></div></aside></main><script type="module" src="auth-page.js"></script></body></html>
